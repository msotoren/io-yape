services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - io-network

  kafka-init:
    image: apache/kafka:3.7.0
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      sh -c "
        kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic io.card.requested.v1 --partitions 12 --replication-factor 1 &&
        kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic io.cards.processing.v1 --partitions 12 --replication-factor 1 &&
        kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic io.cards.issued.v1 --partitions 12 --replication-factor 1 &&
        kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic io.card.requested.v1.dlq --partitions 3 --replication-factor 1
      "
    networks:
      - io-network

  issuer-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: issuer_db
      POSTGRES_USER: issuer
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - ./.data/issuer:/var/lib/postgresql/data
      - ./card-issuer/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U issuer -d issuer_db"]
      interval: 5s
      retries: 5
    networks:
      - io-network

  processor-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: processor_db
      POSTGRES_USER: processor
      POSTGRES_PASSWORD: changeme
    ports:
      - "5433:5432"
    volumes:
      - ./.data/processor:/var/lib/postgresql/data
      - ./card-processor/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U processor -d processor_db"]
      interval: 5s
      retries: 5
    networks:
      - io-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      - io-network

  card-issuer:
    build: ./card-issuer
    ports:
      - "3000:3000"
      - "9091:9091"
    environment:
      PORT: 3000
      METRICS_PORT: 9091
      PG_HOST: issuer-db
      PG_PORT: 5432
      PG_DB: issuer_db
      PG_USER: issuer
      PG_PASSWORD: changeme
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: card-issuer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      issuer-db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - io-network

  card-processor:
    build: ./card-processor
    ports:
      - "9093:9093"
    environment:
      METRICS_PORT: 9093
      PG_HOST: processor-db
      PG_PORT: 5432
      PG_DB: processor_db
      PG_USER: processor
      PG_PASSWORD: changeme
      KAFKA_BROKERS: kafka:9092
      KAFKA_GROUP_ID: card-processor-grp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: card-processor
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      processor-db:
        condition: service_healthy
    networks:
      - io-network

  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - io-network

  grafana:
    image: grafana/grafana:10.4.0
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - prometheus
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./.data/grafana:/var/lib/grafana
    networks:
      - io-network

  tempo:
    image: grafana/tempo:2.5.0
    ports:
      - "3200:3200"
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml
    networks:
      - io-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.99.0
    ports:
      - "4317:4317"
      - "4318:4318"
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel/otel-collector.yaml:/etc/otelcol-contrib/config.yaml
    networks:
      - io-network

networks:
  io-network:
    driver: bridge




