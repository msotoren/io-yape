# yaml-language-server: $schema=https://raw.githubusercontent.com/open-telemetry/opentelemetry-collector/main/cmd/otelcorecol/schema.json
# yaml-language-server: $schema=https://raw.githubusercontent.com/open-telemetry/opentelemetry-collector/main/otelcol/configschema/configschema.json
receivers:
  otlp:
    protocols:
      grpc:
      http:

exporters:
  logging:
    loglevel: info
  otlphttp/tempo:
    endpoint: http://tempo:4318

processors:
  batch:

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [logging, otlphttp/tempo]

