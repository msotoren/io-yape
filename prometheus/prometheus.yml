global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'card-issuer'
    static_configs:
      - targets: ['card-issuer:9091']
    metrics_path: '/metrics'

  - job_name: 'card-processor'
    static_configs:
      - targets: ['card-processor:9093']
    metrics_path: '/metrics'

